<svg width="900" height="360" viewBox="0 0 900 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", monospace;
      letter-spacing: 0;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      letter-spacing: 0;
    }
  </style>

  <defs>
    <filter id="pencil" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="900" height="360" fill="#FFFFFF"/>

  <g fill="#181818" font-size="28" text-anchor="middle" class="mono">
    <text x="450" y="78"> ┌──────────────────────────────────┐</text>
    <text x="450" y="116">│      Make something brilliant!   │</text>
    <text x="450" y="154">└──────────────────────────────────┘</text>
  </g>

  <!-- Cute chibi Doraemon -->
  <g filter="url(#softShadow)">
    <g filter="url(#pencil)" stroke="#2E333A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- short round body -->
      <ellipse cx="450" cy="257" rx="39" ry="38" fill="#159FDC"/>

      <!-- lowered left arm -->
      <path d="M429 242C419 239 410 244 403 251C398 256 397 262 402 266C407 270 413 265 417 260C421 256 425 257 430 258Z" fill="#159FDC"/>

      <!-- relaxed arm -->
      <path d="M471 244C481 237 493 241 501 250C506 256 505 263 500 267C495 271 489 267 485 262C480 257 475 257 468 254Z" fill="#159FDC"/>

      <!-- oversized head -->
      <circle cx="450" cy="196" r="55" fill="#159FDC"/>
      <ellipse cx="450" cy="205" rx="44" ry="42" fill="#FFFFFF"/>

      <!-- big friendly eyes -->
      <ellipse cx="439" cy="170" rx="12" ry="16" fill="#FFFFFF"/>
      <ellipse cx="461" cy="170" rx="12" ry="16" fill="#FFFFFF"/>
      <g>
        <ellipse cx="443" cy="174" rx="3.3" ry="5.8" fill="#20242A" stroke="none"/>
        <ellipse cx="457" cy="174" rx="3.3" ry="5.8" fill="#20242A" stroke="none"/>
        <circle cx="444" cy="172" r="1.2" fill="#FFFFFF" stroke="none"/>
        <circle cx="458" cy="172" r="1.2" fill="#FFFFFF" stroke="none"/>
        <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.46;0.5;0.54;1" dur="4.8s" repeatCount="indefinite"/>
      </g>

      <!-- nose and rosy cheeks -->
      <circle cx="450" cy="188" r="6.5" fill="#EA4A46"/>
      <circle cx="448" cy="186" r="1.5" fill="#FFFFFF" stroke="none"/>
      <circle cx="424" cy="204" r="6" fill="#F5A6B7" stroke="none" opacity="0.62"/>
      <circle cx="476" cy="204" r="6" fill="#F5A6B7" stroke="none" opacity="0.62"/>

      <!-- smiling mouth -->
      <path d="M450 195V204"/>
      <path d="M430 204C434 226 466 226 470 204C461 212 439 212 430 204Z" fill="#E84B51"/>
      <path d="M440 218C445 213 455 213 460 218C455 223 445 223 440 218Z" fill="#F7A0A7" stroke="none"/>

      <!-- whiskers -->
      <path d="M423 190L439 195M421 200L439 200M423 210L439 205"/>
      <path d="M477 190L461 195M479 200L461 200M477 210L461 205"/>

      <!-- Doraemon's signature round, fingerless hands -->
      <circle cx="401" cy="260" r="11" fill="#FFFFFF"/>
      <circle cx="497" cy="260" r="11" fill="#FFFFFF"/>

      <!-- collar and bell -->
      <path d="M411 222C432 229 468 229 489 222L488 231C466 237 434 237 412 231Z" fill="#E64A46"/>
      <g>
        <circle cx="450" cy="234" r="8.5" fill="#F5CA42"/>
        <path d="M444 232H456M450 236V240" stroke-width="1.6"/>
        <circle cx="450" cy="235" r="2" fill="#E7A82E" stroke="none"/>
        <animateTransform attributeName="transform" type="rotate" values="-5 450 226;5 450 226;-5 450 226" keyTimes="0;0.5;1" dur="2.8s" repeatCount="indefinite"/>
      </g>

      <!-- round belly and pocket -->
      <ellipse cx="450" cy="260" rx="29" ry="27" fill="#FFFFFF"/>
      <path d="M430 258C432 277 468 277 470 258Z" fill="#FFFFFF"/>
      <path d="M430 258H470"/>

      <!-- soft oversized feet -->
      <ellipse cx="429" cy="290" rx="23" ry="10" fill="#FFFFFF"/>
      <ellipse cx="471" cy="290" rx="23" ry="10" fill="#FFFFFF"/>
      <path d="M450 275V288"/>
    </g>

    <!-- gentle happy bounce -->
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- tiny decorative sparkles -->
  <g fill="#F5CA42" opacity="0.9">
    <path d="M384 180L387 187L394 190L387 193L384 200L381 193L374 190L381 187Z">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M516 184L518 189L523 191L518 193L516 198L514 193L509 191L514 189Z">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

</svg>
